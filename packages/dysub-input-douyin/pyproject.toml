[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dysub_input_douyin"]

[project]
name = "dysub-input-douyin"
version = "0.1.0"
description = "Douyin input adapter for DySub"
requires-python = ">=3.10"
dependencies = [
    "dysub-core>=0.1.0",
    "yt-dlp>=2023.0.0",
]

[project.entry-points."dysub.inputs"]
douyin = "dysub_input_douyin.adapter:DouyinAdapter"
