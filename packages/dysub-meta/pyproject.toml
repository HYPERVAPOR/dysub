[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dysub"]

[project]
name = "dysub"
version = "0.1.0"
description = "Local subtitle extraction tool"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "DySub Contributors"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "dysub-core>=0.1.0",
    "dysub-input-local>=0.1.0",
    "dysub-input-douyin>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/HYPERVAPOR/dysub"
Repository = "https://github.com/HYPERVAPOR/dysub"
