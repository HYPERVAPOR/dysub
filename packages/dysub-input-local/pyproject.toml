[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dysub_input_local"]

[project]
name = "dysub-input-local"
version = "0.1.1"
description = "Local file input adapter for DySub"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "DySub Contributors"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "dysub-core>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/HYPERVAPOR/dysub"
Repository = "https://github.com/HYPERVAPOR/dysub"

[project.entry-points."dysub.inputs"]
local = "dysub_input_local.adapter:LocalFileAdapter"
