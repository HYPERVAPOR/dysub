[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dysub_input_local"]

[project]
name = "dysub-input-local"
version = "0.1.0"
description = "Local file input adapter for DySub"
requires-python = ">=3.10"
dependencies = [
    "dysub-core>=0.1.0",
]

[project.entry-points."dysub.inputs"]
local = "dysub_input_local.adapter:LocalFileAdapter"
