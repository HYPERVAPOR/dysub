[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dysub-core"
version = "0.1.0"
description = "Core library for DySub local subtitle extraction"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "DySub Contributors"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "tenacity>=8.0",
    "httpx>=0.27",
    "rich>=13.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-httpx>=0.30",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/HYPERVAPOR/dysub"
Repository = "https://github.com/HYPERVAPOR/dysub"

[project.scripts]
dysub = "dysub_core.cli:main"
