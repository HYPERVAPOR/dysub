name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          pip install -e packages/dysub-core[dev]
          pip install -e packages/dysub-input-local
          pip install -e packages/dysub-input-douyin

      - name: Verify installation
        run: |
          pip list | grep -E "dysub|pytest|ruff"
          python -c "import dysub_core; print('dysub-core:', dysub_core.__version__)"

      - name: Lint
        run: |
          ruff check packages apps tests
          ruff format --check packages apps tests

      - name: Test with coverage
        run: pytest -m "not network" --cov=dysub_core --cov-report=xml --cov-fail-under=80

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
