[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["webui"]

[project]
name = "dysub-webui"
version = "0.1.0"
description = "Local WebUI for DySub"
requires-python = ">=3.10"
dependencies = [
    "dysub-core>=0.1.0",
    "gradio>=4.0",
]
